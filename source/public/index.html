<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Horizonte Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d2e;
      --surface2: #252838;
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #2d3148;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #1a1d2e 0%, #252838 100%);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 68px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: .75rem;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -.5px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }
    .logo span { color: var(--accent2); }
    nav { display: flex; gap: .5rem; }
    .nav-btn {
      background: none; border: none; color: var(--text-muted);
      padding: .5rem 1rem; border-radius: 8px; cursor: pointer;
      font-size: .85rem; font-weight: 500; transition: all .2s;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--surface2); color: var(--text);
    }
    .nav-btn.active { color: var(--accent2); }

    /* ── LAYOUT ─────────────────────────────────────────────── */
    .container { max-width: 1280px; margin: 0 auto; padding: 2rem; }

    /* ── STAT CARDS ──────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      transition: transform .2s, box-shadow .2s;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px #0004; }
    .stat-icon {
      width: 44px; height: 44px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .stat-icon.purple { background: #6c63ff22; }
    .stat-icon.green  { background: #10b98122; }
    .stat-icon.red    { background: #ef444422; }
    .stat-icon.yellow { background: #f59e0b22; }
    .stat-value { font-size: 1.8rem; font-weight: 700; line-height: 1; }
    .stat-label { font-size: .78rem; color: var(--text-muted); margin-top: 2px; }

    /* ── TOOLBAR ─────────────────────────────────────────────── */
    .toolbar {
      display: flex; gap: 1rem; align-items: center;
      flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .search-box {
      flex: 1; min-width: 200px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: .6rem 1rem;
      color: var(--text); font-size: .9rem; outline: none;
      transition: border-color .2s;
    }
    .search-box:focus { border-color: var(--accent); }
    .filter-select {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: .6rem 1rem;
      color: var(--text); font-size: .9rem; cursor: pointer; outline: none;
    }
    .btn {
      padding: .6rem 1.2rem; border-radius: 8px; border: none;
      cursor: pointer; font-size: .88rem; font-weight: 600;
      transition: all .2s; display: inline-flex; align-items: center; gap: .4rem;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #7c75ff; transform: translateY(-1px); }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-danger:hover  { background: #f87171; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #34d399; }
    .btn-ghost  { background: var(--surface2); color: var(--text); }
    .btn-ghost:hover  { background: var(--border); }

    /* ── TABLE ───────────────────────────────────────────────── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--surface2); }
    th {
      padding: .85rem 1.2rem; text-align: left;
      font-size: .78rem; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .8px;
    }
    td {
      padding: .9rem 1.2rem; font-size: .88rem;
      border-top: 1px solid var(--border);
    }
    tr:hover td { background: var(--surface2); }
    .badge {
      display: inline-block; padding: .25rem .7rem;
      border-radius: 999px; font-size: .74rem; font-weight: 600;
    }
    .badge-green  { background: #10b98120; color: #10b981; }
    .badge-red    { background: #ef444420; color: #ef4444; }
    .badge-purple { background: #6c63ff20; color: #a78bfa; }
    .badge-yellow { background: #f59e0b20; color: #f59e0b; }
    .action-btn {
      background: none; border: 1px solid var(--border);
      color: var(--text-muted); padding: .3rem .6rem;
      border-radius: 6px; cursor: pointer; font-size: .78rem;
      margin-right: .3rem; transition: all .2s;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.del:hover { border-color: var(--danger); color: var(--danger); }
    .empty-state {
      text-align: center; padding: 4rem 2rem;
      color: var(--text-muted); font-size: .9rem;
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }

    /* ── MODAL ───────────────────────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: #0009; backdrop-filter: blur(6px);
      z-index: 200; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem;
      width: 100%; max-width: 500px;
      box-shadow: 0 24px 80px #0008;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.5rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: .4rem; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: .78rem; color: var(--text-muted); font-weight: 500; }
    input, select {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: .6rem .9rem;
      color: var(--text); font-size: .9rem; outline: none;
      transition: border-color .2s; font-family: inherit;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .modal-footer { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.5rem; }

    /* ── TOAST ───────────────────────────────────────────────── */
    .toast-container {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      display: flex; flex-direction: column; gap: .5rem; z-index: 300;
    }
    .toast {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: .75rem 1.2rem;
      font-size: .85rem; min-width: 240px;
      box-shadow: 0 8px 32px #0006;
      animation: fadeIn .3s ease;
      display: flex; align-items: center; gap: .6rem;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateX(10px); } to { opacity:1; } }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error   { border-left: 3px solid var(--danger); }
    .toast.info    { border-left: 3px solid var(--accent); }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">📚</div>
    Horizonte <span>Inventory</span>
  </div>
  <nav>
    <button class="nav-btn active" id="nav-all"    onclick="filterProducts('all')">Todos</button>
    <button class="nav-btn"        id="nav-avail"  onclick="filterProducts('available')">Disponibles</button>
    <button class="nav-btn"        id="nav-empty"  onclick="filterProducts('empty')">Sin stock</button>
  </nav>
</header>

<!-- MAIN -->
<div class="container">

  <!-- Stats -->
  <div class="stats-grid" id="stats-grid">
    <div class="stat-card">
      <div class="stat-icon purple">📦</div>
      <div>
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total productos</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">✅</div>
      <div>
        <div class="stat-value" id="stat-avail">0</div>
        <div class="stat-label">Con stock</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon red">❌</div>
      <div>
        <div class="stat-value" id="stat-empty">0</div>
        <div class="stat-label">Sin stock</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon yellow">🏷️</div>
      <div>
        <div class="stat-value" id="stat-cats">0</div>
        <div class="stat-label">Categorías</div>
      </div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input id="search-input" class="search-box" type="text" placeholder="🔍  Buscar por nombre, código o categoría..." oninput="renderTable()">
    <select id="cat-filter" class="filter-select" onchange="renderTable()">
      <option value="">Todas las categorías</option>
    </select>
    <button class="btn btn-primary" onclick="openModal()">➕ Agregar producto</button>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Cantidad</th>
          <th>Fecha registro</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Agregar producto</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Código *</label>
        <input id="f-code" type="text" placeholder="BOOK-001">
      </div>
      <div class="form-group">
        <label>Categoría *</label>
        <input id="f-category" type="text" placeholder="Libros">
      </div>
      <div class="form-group full">
        <label>Nombre *</label>
        <input id="f-name" type="text" placeholder="El Quijote de la Mancha">
      </div>
      <div class="form-group">
        <label>Precio *</label>
        <input id="f-price" type="number" step="0.01" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Cantidad *</label>
        <input id="f-quantity" type="number" placeholder="0">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveProduct()">Guardar</button>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-container" id="toasts"></div>

<script>
let allProducts = [];
let editingId = null;
let currentFilter = 'all';

// ── API ────────────────────────────────────────────────────────
async function api(method, url, body) {
  const r = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Error');
  return data;
}

// ── LOAD ───────────────────────────────────────────────────────
async function load() {
  allProducts = await api('GET', '/api/products');
  updateStats();
  updateCatFilter();
  renderTable();
}

function updateStats() {
  const avail = allProducts.filter(p => p.quantity > 0);
  const empty = allProducts.filter(p => p.quantity === 0);
  const cats  = [...new Set(allProducts.map(p => p.category))];
  document.getElementById('stat-total').textContent = allProducts.length;
  document.getElementById('stat-avail').textContent = avail.length;
  document.getElementById('stat-empty').textContent = empty.length;
  document.getElementById('stat-cats').textContent  = cats.length;
}

function updateCatFilter() {
  const cats = [...new Set(allProducts.map(p => p.category))].sort();
  const sel = document.getElementById('cat-filter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Todas las categorías</option>' +
    cats.map(c => `<option value="${c}">${c}</option>`).join('');
  sel.value = cur;
}

// ── RENDER TABLE ───────────────────────────────────────────────
function renderTable() {
  const search  = document.getElementById('search-input').value.toLowerCase();
  const catFilt = document.getElementById('cat-filter').value;
  let list = allProducts;

  if (currentFilter === 'available') list = list.filter(p => p.quantity > 0);
  if (currentFilter === 'empty')     list = list.filter(p => p.quantity === 0);
  if (catFilt)                        list = list.filter(p => p.category === catFilt);
  if (search)                         list = list.filter(p =>
    p.name.toLowerCase().includes(search) ||
    p.code.toLowerCase().includes(search) ||
    p.category.toLowerCase().includes(search)
  );

  const tbody = document.getElementById('table-body');
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="7">
      <div class="empty-state"><div class="empty-icon">📭</div>No se encontraron productos</div>
    </td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(p => {
    const stock = p.quantity > 0
      ? `<span class="badge badge-green">✓ ${p.quantity}</span>`
      : `<span class="badge badge-red">Sin stock</span>`;
    const date = p.created_at ? p.created_at.substring(0,10) : '—';
    const catClass = catColor(p.category);
    return `<tr>
      <td><code style="color:var(--accent2);font-size:.82rem">${p.code}</code></td>
      <td><strong>${p.name}</strong></td>
      <td><span class="badge ${catClass}">${p.category}</span></td>
      <td>₡${parseFloat(p.price).toLocaleString('es-CR',{minimumFractionDigits:2})}</td>
      <td>${stock}</td>
      <td style="color:var(--text-muted);font-size:.82rem">${date}</td>
      <td>
        <button class="action-btn" onclick="editProduct(${p.id})">✏️ Editar</button>
        <button class="action-btn del" onclick="deleteProduct(${p.id},'${p.code}')">🗑️ Eliminar</button>
      </td>
    </tr>`;
  }).join('');
}

function catColor(cat) {
  const c = cat.toLowerCase();
  if (c.includes('libro'))   return 'badge-purple';
  if (c.includes('oficina')) return 'badge-yellow';
  if (c.includes('educ'))    return 'badge-green';
  return 'badge-purple';
}

// ── FILTER NAV ────────────────────────────────────────────────
function filterProducts(f) {
  currentFilter = f;
  ['all','avail','empty'].forEach(x => document.getElementById(`nav-${x}`).classList.remove('active'));
  const map = { all:'nav-all', available:'nav-avail', empty:'nav-empty' };
  document.getElementById(map[f]).classList.add('active');
  renderTable();
}

// ── MODAL ─────────────────────────────────────────────────────
function openModal(product) {
  editingId = product ? product.id : null;
  document.getElementById('modal-title').textContent = product ? 'Editar producto' : 'Agregar producto';
  document.getElementById('f-code').value     = product?.code     ?? '';
  document.getElementById('f-name').value     = product?.name     ?? '';
  document.getElementById('f-category').value = product?.category ?? '';
  document.getElementById('f-price').value    = product?.price    ?? '';
  document.getElementById('f-quantity').value = product?.quantity ?? '';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

// ── SAVE ──────────────────────────────────────────────────────
async function saveProduct() {
  const body = {
    code:     document.getElementById('f-code').value.trim(),
    name:     document.getElementById('f-name').value.trim(),
    category: document.getElementById('f-category').value.trim(),
    price:    parseFloat(document.getElementById('f-price').value),
    quantity: parseInt(document.getElementById('f-quantity').value)
  };
  if (!body.code || !body.name || !body.category || isNaN(body.price) || isNaN(body.quantity)) {
    toast('Completa todos los campos', 'error'); return;
  }
  try {
    if (editingId) {
      await api('PUT', `/api/products/${editingId}`, body);
      toast('Producto actualizado ✅', 'success');
    } else {
      await api('POST', '/api/products', body);
      toast('Producto creado ✅', 'success');
    }
    closeModal(); await load();
  } catch (e) { toast(e.message, 'error'); }
}

// ── EDIT ──────────────────────────────────────────────────────
async function editProduct(id) {
  const product = allProducts.find(p => p.id === id);
  if (product) openModal(product);
}

// ── DELETE ─────────────────────────────────────────────────────
async function deleteProduct(id, code) {
  if (!confirm(`¿Eliminar el producto "${code}"?`)) return;
  await api('DELETE', `/api/products/${id}`);
  toast('Producto eliminado 🗑️', 'info');
  await load();
}

// ── TOAST ─────────────────────────────────────────────────────
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success:'✅', error:'❌', info:'ℹ️' };
  el.innerHTML = `<span>${icons[type]||'💬'}</span> ${msg}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── CLOSE MODAL ON OVERLAY CLICK ──────────────────────────────
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

load();
</script>
</body>
</html>
